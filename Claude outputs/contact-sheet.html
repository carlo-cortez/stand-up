<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand Up — mascot candidates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 48px 32px 64px;
    background: #FAF8F3;
    color: #22302A;
    font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  }
  h1 {
    margin: 0 0 6px;
    font-family: 'Newsreader', Georgia, serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .sub { margin: 0 0 40px; font-size: 15px; color: #5A6960; max-width: 640px; line-height: 1.5; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
    max-width: 1200px;
  }
  figure { margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .art { width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden; border: 1px solid #DFE3D8; }
  .art svg { display: block; width: 100%; height: 100%; }
  figcaption { display: flex; align-items: center; gap: 12px; }
  .tiny { width: 32px; height: 32px; flex-shrink: 0; border-radius: 7px; overflow: hidden; border: 1px solid #DFE3D8; }
  .tiny svg { display: block; width: 100%; height: 100%; }
  .label { display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 15px; font-weight: 700; }
  .desc { font-size: 13px; color: #5A6960; line-height: 1.35; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { background: #151A16; color: #EDF0E8; }
    :root:not([data-theme="light"]) .sub, :root:not([data-theme="light"]) .desc { color: #A2AFA4; }
    :root:not([data-theme="light"]) .art, :root:not([data-theme="light"]) .tiny { border-color: #2E382F; }
  }
</style>
</head>
<body>
