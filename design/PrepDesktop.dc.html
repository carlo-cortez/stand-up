<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prep — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body { margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; background: #FAF8F3; }
a { color: #3F5A48; } a:hover { color: #2C4033; }
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FAF8F3; padding: 40px 56px 48px; display: flex; flex-direction: column; gap: 32px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #DFE3D8; border-radius: 999px; background: #FFFFFF;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}};"></span>
      <span style="font-size: 14px; font-weight: 600; color: #41504A;">Tech · Hard</span>
    </div>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500; color: #41504A;">Stand Up</span>
    <button type="button" aria-label="End practice session" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 999px; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#41504A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 5 L15 15"></path><path d="M15 5 L5 15"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 72px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 36px; max-width: 760px;">

      <div style="position: relative; width: 168px; height: 168px;">
        <svg width="168" height="168" viewBox="0 0 132 132" style="display: block; transform: rotate(-90deg);" aria-hidden="true">
          <circle cx="66" cy="66" r="58" fill="none" stroke="#E4E7DD" stroke-width="8"></circle>
          <circle cx="66" cy="66" r="58" fill="none" stroke="{{accent}}" stroke-width="8" stroke-linecap="round" stroke-dasharray="364.42" stroke-dashoffset="97.18"></circle>
        </svg>
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <span style="font-size: 54px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: #22302A;">22</span>
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #5A6960;">Prep</span>
        </div>
      </div>

      <p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 52px; font-weight: 400; line-height: 1.18; letter-spacing: -0.02em; text-align: center; text-wrap: pretty; color: #22302A;">Should AI be allowed to make hiring decisions?</p>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button type="button" style="min-width: 240px; min-height: 60px; border: none; border-radius: 18px; background: #3F5A48; color: #FAF8F3; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer;">Start now</button>
        <button type="button" style="min-height: 60px; padding: 0 22px; border: 1px solid #DFE3D8; border-radius: 18px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #3F5A48; cursor: pointer;">Skip this topic · 1 left</button>
      </div>

      <p style="margin: 0; font-size: 14px; color: #5A6960;">Speaking starts on its own when prep runs out.</p>

    </div>

    <div style="width: 340px; box-sizing: border-box; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Structure hint</span>
        <button type="button" style="min-height: 44px; padding: 0 2px; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #3F5A48; cursor: pointer;">Hide</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 10px; background: #EAEFE5; color: #35503E; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">P</span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600; color: #22302A;">Point</span>
            <span style="font-size: 15px; line-height: 1.4; color: #5A6960;">Answer in one sentence.</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 10px; background: #EAEFE5; color: #35503E; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">R</span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600; color: #22302A;">Reason</span>
            <span style="font-size: 15px; line-height: 1.4; color: #5A6960;">Why you land there.</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 10px; background: #EAEFE5; color: #35503E; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">E</span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600; color: #22302A;">Example</span>
            <span style="font-size: 15px; line-height: 1.4; color: #5A6960;">One story, case, or number.</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 10px; background: #EAEFE5; color: #35503E; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">P</span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600; color: #22302A;">Point</span>
            <span style="font-size: 15px; line-height: 1.4; color: #5A6960;">Say it again, shorter.</span>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E8C74","options":["#6E8C74","#7C9A83","#5B7A63","#8AA582"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6E8C74' };
  }
}
</script>
</body>
</html>
