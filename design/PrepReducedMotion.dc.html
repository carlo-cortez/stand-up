<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prep — reduced motion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body { margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; background: #FAF8F3; }
a { color: #3F5A48; } a:hover { color: #2C4033; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; padding: 60px 24px 28px; display: flex; flex-direction: column; gap: 8px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #DFE3D8; border-radius: 999px; background: #FFFFFF;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: {{accent}};"></span>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: #41504A;">Movies · Medium</span>
    </div>
    <button type="button" aria-label="End practice session" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 999px; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#41504A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M5 5 L15 15"></path><path d="M15 5 L5 15"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: #22302A;">22</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5A6960;">Sec prep</span>
      </div>
      <div style="width: 100%; display: flex; gap: 4px;">
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: {{accent}};"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: #E4E7DD;"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: #E4E7DD;"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: #E4E7DD;"></span>
        <span style="flex-grow: 1; height: 10px; border-radius: 3px; background: #E4E7DD;"></span>
      </div>
      <span style="font-size: 13px; color: #5A6960;">One block drops every two seconds.</span>
    </div>

    <p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 1.22; letter-spacing: -0.01em; text-align: center; text-wrap: pretty; color: #22302A;">Which movie villain actually had a point?</p>

    <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; color: #3F5A48; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#3F5A48" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5 L8 10.5 L12 6.5"></path></svg>
      Show structure hint
    </button>

  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <button type="button" style="min-height: 56px; border: none; border-radius: 16px; background: #3F5A48; color: #FAF8F3; font-family: inherit; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; cursor: pointer;">Start now</button>
    <button type="button" style="min-height: 44px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #3F5A48; cursor: pointer;">Skip this topic · 1 left</button>
    <p style="margin: 0; text-align: center; font-size: 13px; line-height: 1.35; color: #5A6960;">Speaking starts on its own when prep runs out.</p>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E8C74","options":["#6E8C74","#7C9A83","#5B7A63","#8AA582"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6E8C74' };
  }
}
</script>
</body>
</html>
