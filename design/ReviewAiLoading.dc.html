<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review — AI feedback loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body { margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; background: #FAF8F3; }
a { color: #3F5A48; } a:hover { color: #2C4033; }
</style>
</helmet>
<div style="width: 390px; height: 560px; box-sizing: border-box; background: #FAF8F3; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px;">

  <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5A6960;">AI feedback card · loading</span>

  <div style="box-sizing: border-box; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7" stroke="#E0E6D6" stroke-width="2.5"></circle><path d="M9 2 A7 7 0 0 1 16 9" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round"></path></svg>
      <span style="font-size: 15px; font-weight: 600; color: #22302A;">Listening back to your round…</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="height: 12px; border-radius: 6px; background: #EDF0E7;"></span>
      <span style="height: 12px; border-radius: 6px; background: #EDF0E7;"></span>
      <span style="width: 70%; height: 12px; border-radius: 6px; background: #EDF0E7;"></span>
    </div>

    <div style="display: flex; gap: 10px;">
      <span style="flex-grow: 1; height: 62px; border-radius: 14px; background: #F2F5EC;"></span>
      <span style="flex-grow: 1; height: 62px; border-radius: 14px; background: #F2F5EC;"></span>
      <span style="flex-grow: 1; height: 62px; border-radius: 14px; background: #F2F5EC;"></span>
    </div>

    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #5A6960;">This takes about ten seconds. Your ratings are already saved, so you can carry on and check back.</p>
  </div>

  <button type="button" style="min-height: 52px; border: 1px solid #DFE3D8; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #3F5A48; cursor: pointer;">Next topic</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E8C74","options":["#6E8C74","#7C9A83","#5B7A63","#8AA582"]},"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6E8C74' };
  }
}
</script>
</body>
</html>
