<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session setup — defaults</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body { margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; background: #FAF8F3; }
a { color: #3F5A48; } a:hover { color: #2C4033; }
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #FAF8F3; padding: 60px 24px 28px; display: flex; flex-direction: column; gap: 22px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <button type="button" aria-label="Back to home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 999px; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#41504A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 L6 10 L12 16"></path></svg>
    </button>
    <span style="font-size: 16px; font-weight: 600; color: #22302A;">Set the round</span>
    <span style="width: 44px;"></span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px;">

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Topics</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 999px; font-size: 14px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="category" value="surprise" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">Surprise me</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="general" style="position: absolute; width: 1px; height: 1px; opacity: 0;">General</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="tech" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Tech</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="society" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Society &amp; Politics</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="games" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Games</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="movies" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Movies</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="interview" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Interview Questions</label>
        <label style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 14px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category" value="wildcard" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Wildcard</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Difficulty</legend>
      <div style="display: flex; gap: 8px;">
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="difficulty" value="easy" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Easy</label>
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 14px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="difficulty" value="medium" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">Medium</label>
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="difficulty" value="hard" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Hard</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Prep time</legend>
      <div style="display: flex; gap: 8px;">
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="prep" value="15" style="position: absolute; width: 1px; height: 1px; opacity: 0;">15 sec</label>
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 14px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="prep" value="30" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">30 sec</label>
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="prep" value="60" style="position: absolute; width: 1px; height: 1px; opacity: 0;">60 sec</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px;">
      <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Speaking time</legend>
      <div style="display: flex; gap: 8px;">
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="speaking" value="60" style="position: absolute; width: 1px; height: 1px; opacity: 0;">1 min</label>
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 14px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="speaking" value="120" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">2 min</label>
        <label style="position: relative; flex-grow: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="speaking" value="180" style="position: absolute; width: 1px; height: 1px; opacity: 0;">3 min</label>
      </div>
    </fieldset>

    <label for="record-toggle" style="box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 68px; padding: 14px 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 18px; cursor: pointer;">
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600; color: #22302A;">Record this round</span>
        <span style="font-size: 13px; line-height: 1.35; color: #5A6960;">Stays on your device. Delete it any time.</span>
      </span>
      <span style="position: relative; flex-shrink: 0; width: 52px; height: 32px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px; box-sizing: border-box;">
        <input type="checkbox" id="record-toggle" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">
        <span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF;"></span>
      </span>
    </label>

  </div>

  <button type="button" style="min-height: 60px; border: none; border-radius: 18px; background: #3F5A48; color: #FAF8F3; font-family: inherit; font-size: 18px; font-weight: 600; cursor: pointer;">Start the round</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E8C74","options":["#6E8C74","#7C9A83","#5B7A63","#8AA582"]},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6E8C74' };
  }
}
</script>
</body>
</html>
