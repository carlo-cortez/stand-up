<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session setup — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body { margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; background: #FAF8F3; }
a { color: #3F5A48; } a:hover { color: #2C4033; }
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FAF8F3; padding: 40px 56px 48px; display: flex; flex-direction: column; gap: 32px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <button type="button" aria-label="Back to home" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 8px; border: none; background: transparent; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 600; color: #3F5A48; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#3F5A48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 L6 10 L12 16"></path></svg>
      Home
    </button>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500; color: #41504A;">Stand Up</span>
    <span style="width: 90px;"></span>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: flex-start; justify-content: center;">
    <div style="width: 880px; display: flex; flex-direction: column; gap: 28px;">

      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 40px; font-weight: 400; line-height: 1.15; letter-spacing: -0.02em; color: #22302A;">Set the round</h1>

      <div style="box-sizing: border-box; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 26px;">

        <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px;">
          <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Topics</legend>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 999px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="category-desk" value="surprise" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">Surprise me</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="general" style="position: absolute; width: 1px; height: 1px; opacity: 0;">General</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="tech" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Tech</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="society" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Society &amp; Politics</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="games" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Games</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="movies" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Movies</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="interview" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Interview Questions</label>
            <label style="position: relative; display: flex; align-items: center; min-height: 48px; padding: 0 18px; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="category-desk" value="wildcard" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Wildcard</label>
          </div>
        </fieldset>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">

          <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px;">
            <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Difficulty</legend>
            <div style="display: flex; gap: 8px;">
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="difficulty-desk" value="easy" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Easy</label>
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 14px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="difficulty-desk" value="medium" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">Medium</label>
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="difficulty-desk" value="hard" style="position: absolute; width: 1px; height: 1px; opacity: 0;">Hard</label>
            </div>
          </fieldset>

          <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px;">
            <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Prep time</legend>
            <div style="display: flex; gap: 8px;">
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="prep-desk" value="15" style="position: absolute; width: 1px; height: 1px; opacity: 0;">15s</label>
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 14px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="prep-desk" value="30" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">30s</label>
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="prep-desk" value="60" style="position: absolute; width: 1px; height: 1px; opacity: 0;">60s</label>
            </div>
          </fieldset>

          <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 12px;">
            <legend style="padding: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5A6960;">Speaking time</legend>
            <div style="display: flex; gap: 8px;">
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="speaking-desk" value="60" style="position: absolute; width: 1px; height: 1px; opacity: 0;">1 min</label>
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #3F5A48; background: #3F5A48; border-radius: 14px; font-size: 15px; font-weight: 600; color: #FAF8F3; cursor: pointer;"><input type="radio" name="speaking-desk" value="120" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">2 min</label>
              <label style="position: relative; flex-grow: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border: 1px solid #DFE3D8; background: #FFFFFF; border-radius: 14px; font-size: 15px; font-weight: 600; color: #41504A; cursor: pointer;"><input type="radio" name="speaking-desk" value="180" style="position: absolute; width: 1px; height: 1px; opacity: 0;">3 min</label>
            </div>
          </fieldset>

        </div>

        <label for="record-toggle-desk" style="box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 76px; padding: 18px 22px; border: 1px solid #DFE3D8; background: #FBFCF8; border-radius: 18px; cursor: pointer;">
          <span style="display: flex; flex-direction: column; gap: 3px;">
            <span style="font-size: 17px; font-weight: 600; color: #22302A;">Record this round</span>
            <span style="font-size: 14px; line-height: 1.4; color: #5A6960;">Stays in this browser, on this device. Delete it whenever you like.</span>
          </span>
          <span style="position: relative; flex-shrink: 0; width: 56px; height: 34px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: flex-end; padding: 0 4px; box-sizing: border-box;">
            <input type="checkbox" id="record-toggle-desk" checked style="position: absolute; width: 1px; height: 1px; opacity: 0;">
            <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF;"></span>
          </span>
        </label>

      </div>

      <div style="display: flex; align-items: center; gap: 16px;">
        <button type="button" style="min-width: 260px; min-height: 64px; border: none; border-radius: 18px; background: #3F5A48; color: #FAF8F3; font-family: inherit; font-size: 19px; font-weight: 600; cursor: pointer;">Start the round</button>
        <span style="font-size: 14px; color: #5A6960;">These become your defaults — Home's big button skips this screen next time.</span>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E8C74","options":["#6E8C74","#7C9A83","#5B7A63","#8AA582"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6E8C74' };
  }
}
</script>
</body>
</html>
