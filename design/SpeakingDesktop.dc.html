<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaking — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
<style>
body { margin: 0; font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif; background: #F2F5EC; }
a { color: #3F5A48; } a:hover { color: #2C4033; }
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F2F5EC; padding: 40px 56px 56px; display: flex; flex-direction: column; gap: 32px;">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #D8E0CE; border-radius: 999px; background: #FBFCF7;">
      <span style="width: 9px; height: 9px; border-radius: 999px; background: #B4664F;"></span>
      <span style="font-size: 14px; font-weight: 600; color: #41504A;">Recording</span>
    </div>
    <span style="font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 500; color: #41504A;">Stand Up</span>
    <span style="font-size: 14px; font-weight: 600; color: #4B5A50;">General · Easy · target 2:00</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px;">

    <p style="margin: 0; max-width: 820px; font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 1.25; text-align: center; text-wrap: pretty; color: #41504A;">What's a small thing that instantly makes your day better?</p>

    <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 999px; background: #E1EBD9;">
      <svg width="16" height="16" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="#4F7359"></circle></svg>
      <span style="font-size: 16px; font-weight: 700; letter-spacing: 0.02em; color: #2F4A38;">On track</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <span style="font-size: 208px; font-weight: 600; line-height: 0.95; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; color: #22302A;">1:23</span>
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #5A6960;">Left to speak</span>
    </div>

    <div style="width: 720px; height: 10px; border-radius: 999px; background: #E0E6D6; display: flex;">
      <div style="width: 31%; height: 10px; border-radius: 999px; background: {{accent}};"></div>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 16px;">
    <button type="button" style="min-width: 260px; min-height: 64px; border: none; border-radius: 18px; background: #3F5A48; color: #FAF8F3; font-family: inherit; font-size: 19px; font-weight: 600; cursor: pointer;">Finish</button>
    <span style="font-size: 14px; color: #5A6960;">Or press Space when you're done.</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6E8C74","options":["#6E8C74","#7C9A83","#5B7A63","#8AA582"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#6E8C74' };
  }
}
</script>
</body>
</html>
