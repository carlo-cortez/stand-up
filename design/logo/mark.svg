<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1536">
  <!-- Stand Up app icon: Ace stepping out of the deck. Ace (white, grey-green
       border, dot eyes, small smile) leans back 9 degrees as he does in empty
       History, in front of a card back (darker green, a light rule printed
       inside, like the backs in the card draw) at 2, on the app's green.
       Composition from A8, 25 September 2026. Every PNG in public/ is drawn
       from this file by export.sh. The face sits 23% from centre, inside the
       40% circle Android keeps. -->
  <rect width="1536" height="1536" fill="#3F5A48"/>
  <g transform="rotate(-2 1036 1000)">
    <rect x="246" y="150" width="1280" height="1450" rx="150" fill="#2F4636"/>
    <rect x="326" y="230" width="1120" height="1290" rx="96" fill="none" stroke="#FAF8F3" stroke-opacity="0.35" stroke-width="18"/>
  </g>
  <g transform="rotate(-9 1036 1000)">
    <rect x="396" y="310" width="1280" height="1450" rx="150" fill="#FFFFFF" stroke="#C9D0C2" stroke-width="44"/>
    <circle cx="916" cy="940" r="54" fill="#22302A"/>
    <circle cx="1156" cy="940" r="54" fill="#22302A"/>
    <path d="M964 1058 Q1036 1118 1108 1058" fill="none" stroke="#22302A" stroke-width="40" stroke-linecap="round"/>
  </g>
</svg>
