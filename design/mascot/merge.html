<style>

  .s32 { width: 32px; height: 32px; }

  .label { display: flex; flex-direction: column; gap: 2px; }

  .desc { font-size: 13px; color: #5A6960; line-height: 1.35; }

    :root:not([data-theme="light"]) .art, :root:not([data-theme="light"]) .sizes span { border-color: #2E382F; }
    :root:not([data-theme="light"]) .art.hero { border-color: #90B198; }
